<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>目录</title>
<link rel="stylesheet" href="{{ css_uri }}">
<style>
  @page { size: A4; }
  html, body { margin: 0; padding: 0; background: #fff; }
  .toc-page { padding: 0; }
  .toc-list { column-count: 1; }
</style>
</head>
<body class="{% if book_kicker == '速查手册' %}toc-quick{% endif %}">
<div class="toc-page">
  <div class="toc-head">
    <div class="kicker">{{ book_kicker }} · CONTENTS</div>
    <h1>目录</h1>
    <div style="margin-top:3mm; font-family:'Microsoft YaHei',sans-serif; font-size:9pt; color:#6d7f82; letter-spacing:.06em;">
      {{ book_title }}　|　页码为正文页码
    </div>
  </div>

  <ul class="toc-list">
    {% for e in entries %}
      <li class="toc-item {{ e['level'] }}">
        <span class="toc-title">{{ e['title'] }}</span>
        <span class="toc-dots"></span>
        <span class="toc-page">{{ page_map.get(e['anchor'], '—') }}</span>
      </li>
    {% endfor %}
  </ul>

  <div class="toc-note">
    <b>使用建议</b>　{{ toc_note }}
  </div>
</div>
</body>
</html>
